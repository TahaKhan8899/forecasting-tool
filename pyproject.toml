[project]
name = "forecasting-api"
version = "0.1.0"
description = "A robust backend system and associated tools to automate the collection, calculation, and forecasting of key business metrics"
authors = [
    {name = "Taha Khan",email = "taha@agentarc.dev"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[all] (>=0.115.12,<0.116.0)",
    "sqlalchemy[asyncio] (>=2.0.40,<3.0.0)",
    "asyncpg (>=0.28.0,<0.29.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "structlog (>=25.2.0,<26.0.0)",
    "python-json-logger (>=3.3.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
httpx = "^0.28.1"

[tool.poetry]
packages = [{include = "app"}]

